{% extends "gestion/base.html" %}
{% block titre %}Facture - Info{% endblock %}
{% block contenu %}
<h1 class="h3 mb-0 text-gray-800">Panier &rarr; Information Facture</h1>
<div class="card shadow mb-4"><div class="card-header py-3">Étape 4
<div class="progress"><div class="progress-bar bg-success" style="width:100%"></div></div></div>
<div class="card-body">
<form action="{% url 'facture_creer' %}" method="GET">
    <legend>Infos client</legend>
    <div class="row">
        <div class="col-6"><div class="form-group"><label>Prénom Nom</label>
            <input type="text" class="form-control" name="prenom_nom" value="{{ cli.prenom_nom }}" readonly></div></div>
        <div class="col-6"><div class="form-group"><label>Téléphone</label>
            <input type="text" class="form-control" name="telephone" value="{{ cli.telephone }}" readonly></div></div>
    </div>
    <legend>Infos commande</legend>
    <table class="table table-bordered" width="100%">
        <thead><tr><th>Désignation</th><th>P.U</th><th>Quantité</th><th>Total</th></tr></thead>
        <tbody>
        {% for l in lignes %}
        <tr>
            <td><input type="text" class="form-control" name="des[]" value="{{ l.des }}" readonly></td>
            <td><input type="text" class="form-control" name="price[]" value="{{ l.price }}" readonly></td>
            <td><input type="text" class="form-control" name="qty[]" value="{{ l.qty }}" readonly></td>
            <td><input type="text" class="form-control" name="subtot[]" value="{{ l.subtot }}" readonly></td>
        </tr>
        {% endfor %}
        </tbody>
        <tfoot><tr><th colspan="2">TOTAL</th>
            <th><input type="text" class="form-control" name="totqty" value="{{ totqty }}" readonly></th>
            <th><input type="text" class="form-control" id="total" name="total" value="{{ total }}" readonly></th></tr></tfoot>
    </table>
    <legend>Informations supplémentaires</legend>
    <div class="row">
        <div class="col-4"><div class="form-group"><label>Date facture</label>
            <input type="date" class="form-control" name="date_facture" value="{{ datefact }}"></div></div>
        <div class="col-4"><div class="form-group"><label>Numéro facture</label>
            <input type="text" class="form-control" name="numero_facture" value="{{ num_fact }}" readonly>
            <input type="hidden" name="cmpt" value="{{ cmpt }}"></div></div>
        <div class="col-4"><div class="form-group"><label>Date échéance</label>
            <input type="date" class="form-control" name="date_echeance" value="{{ echeance }}"></div></div>
    </div>
    <div class="row">
        <div class="col-3"><div class="form-group"><label>Remise (FCFA)</label>
            <input type="number" class="form-control" id="remise" name="remise" value="0" min="0" oninput="calc()"></div></div>
        <div class="col-3"><div class="form-group"><label>Net à payer</label>
            <input type="number" class="form-control" id="net" name="net_a_payer" value="{{ total }}" readonly></div></div>
        <div class="col-3"><div class="form-group"><label>Montant encaissé</label>
            <input type="number" class="form-control" id="montpaye" name="montpaye" value="0" min="0" oninput="calc()"></div></div>
        <div class="col-3"><div class="form-group"><label>Reste à payer</label>
            <input type="number" class="form-control" id="reste" name="reste" value="{{ total }}" readonly></div></div>
    </div>
    <input type="hidden" name="id_client" value="{{ id_client }}">
    <input type="hidden" name="id_article" value="{{ id_article }}">
    <button type="submit" class="btn btn-success" name="bt_valider">Générer la facture</button>
</form>
</div></div>
<script>
function calc(){var t=parseFloat(document.getElementById('total').value||0);
var r=parseFloat(document.getElementById('remise').value||0);
var p=parseFloat(document.getElementById('montpaye').value||0);
if(r<0)r=0;if(r>t)r=t;var net=t-r;document.getElementById('net').value=net;
document.getElementById('reste').value=net-p;}
</script>
{% endblock %}
