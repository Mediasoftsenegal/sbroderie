{% extends "gestion/base.html" %}
{% block titre %}Modèles{% endblock %}
{% block contenu %}
<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <div>
        <h1 class="h3 mb-1 text-gray-800">Modèles</h1>
        <nav class="page-breadcrumb"><span>S.B.M</span> <i class="fas fa-chevron-right"></i> <span>Modèles</span></nav>
    </div>
    <button class="btn btn-info btn-sm shadow-sm" data-toggle="modal" data-target="#modalModele">
        <i class="fas fa-plus fa-sm"></i> Nouveau modèle</button>
</div>

<div class="row">
    <div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card h-100"><div class="card-body">
        <div class="stat-icon stat-icon-primary"><i class="fas fa-layer-group"></i></div>
        <div class="stat-label">Total modèles</div><div class="stat-value">{{ modeles|length }}</div>
    </div></div></div>
</div>

<div class="card shadow mb-4">
    <div class="card-header"><h6 class="m-0 font-weight-bold text-primary">Liste des modèles</h6></div>
    <div class="card-body"><div class="table-responsive">
    <table class="table" id="dataTable" width="100%">
        <thead><tr><th>N°</th><th>Libellé</th></tr></thead>
        <tbody>
        {% for m in modeles %}
        <tr>
            <td style="width:60px">{{ forloop.counter }}</td>
            <td>
                <div class="d-flex align-items-center">
                    <span class="icon-avatar {% cycle 'ia-primary' 'ia-blue' 'ia-green' 'ia-teal' 'ia-purple' %}"><i class="fas fa-layer-group"></i></span>
                    <span class="ml-2 cust-name text-uppercase">{{ m.libmod }}</span>
                </div>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    </div></div>
</div>

<div class="modal fade" id="modalModele" role="dialog"><div class="modal-dialog"><div class="modal-content">
<form method="POST" action="{% url 'modele_insert' %}">{% csrf_token %}
<div class="modal-header"><h5 class="modal-title">Nouveau modèle</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>
<div class="modal-body"><div class="form-group"><label>Libellé du modèle</label>
    <input name="libmod" class="form-control" style="text-transform:uppercase" required></div></div>
<div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
<button type="submit" class="btn btn-success" name="bt_modele">Enregistrer</button></div>
</form></div></div></div>
{% endblock %}
