{% extends "gestion/base.html" %}
{% block titre %}Modifier client{% endblock %}
{% block contenu %}
<h1 class="h3 mb-4 text-gray-800">Modifier le client</h1>
<div class="card shadow mb-4"><div class="card-body">
<form method="POST">{% csrf_token %}
    <div class="form-group"><label>Code client</label><input name="codecli" class="form-control" value="{{ cli.codecli }}"></div>
    <div class="form-group"><label>Prénom & Nom</label><input name="prenom_nom" class="form-control" value="{{ cli.prenom_nom }}"></div>
    <div class="form-group"><label>Genre</label>
        <select name="genre" class="form-control">
            <option {% if cli.genre == "Homme" %}selected{% endif %}>Homme</option>
            <option {% if cli.genre == "Femme" %}selected{% endif %}>Femme</option>
        </select></div>
    <div class="form-group"><label>Téléphone</label><input name="telephone" class="form-control" value="{{ cli.telephone }}"></div>
    <div class="form-group"><label>Adresse</label><input name="adresse" class="form-control" value="{{ cli.adresse }}"></div>
    <button type="submit" class="btn btn-primary" name="bt_modif_client">Modifier</button>
    <a href="{% url 'clients' %}" class="btn btn-secondary">Annuler</a>
</form>
</div></div>
{% endblock %}
